services:
  auth-postgres:
    image: pgvector/pgvector:pg17
    container_name: auth-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${AUTH_POSTGRES_USER:-pgcore}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      AUTH_MONITOR_PASSWORD: ${AUTH_MONITOR_PASSWORD}
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
      - ./configs/auth-postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./configs/auth-postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - core-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=core-network"
      - "traefik.tcp.routers.auth-postgres.rule=HostSNI(`auth-postgres.local`)"
      - "traefik.tcp.routers.auth-postgres.entrypoints=websecure"
      - "traefik.tcp.routers.auth-postgres.tls=true"
      - "traefik.tcp.services.auth-postgres.loadbalancer.server.port=5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  keycloak:
    build:
      context: ./services/keycloak
      dockerfile: Dockerfile
    image: keycloak-optimized:26.2.5
    container_name: keycloak
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      KC_DB_URL: jdbc:postgresql://auth-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: auth.local
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    command: start --optimized
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - core-network
    depends_on:
      auth-postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=core-network"
      - "traefik.http.routers.keycloak.rule=Host(`auth.local`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  redis:
    image: redis:7-alpine
    container_name: registry-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: redis-server --save "" --appendonly no
    volumes:
      - redis_data:/data
    networks:
      - core-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=core-network"
      - "traefik.tcp.routers.redis.rule=HostSNI(`redis.local`)"
      - "traefik.tcp.routers.redis.entrypoints=websecure"
      - "traefik.tcp.routers.redis.tls=true"
      - "traefik.tcp.services.redis.loadbalancer.server.port=6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "5001:5001"
    volumes:
      - ./configs/registry/config.yml:/etc/docker/registry/config.yml:ro
      - ./configs/registry:/var/lib/registry
    networks:
      - core-network
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=core-network"
      - "traefik.http.routers.registry.rule=Host(`registry.local`)"
      - "traefik.http.routers.registry.entrypoints=websecure"
      - "traefik.http.routers.registry.tls=true"
      - "traefik.http.services.registry.loadbalancer.server.port=5001"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://0.0.0.0:5001/v2/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080"  # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../ai-stack-homelab/configs/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../ai-stack-homelab/configs/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_certs:/certs
      - traefik_logs:/var/log/traefik
    networks:
      - core-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=core-network"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.local`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.service=api@internal"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  vault:
    image: hashicorp/vault:latest
    container_name: vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    security_opt:
      - no-new-privileges:true
    user: root
    ports:
      - "8083:8200"
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
      - ./configs/vault/config.hcl:/vault/config/config.hcl:ro
    command: >
      sh -ec '
      chown -R vault:vault /vault/data /vault/logs;
      exec su vault -s /bin/sh -c "vault server -config=/vault/config/config.hcl"
      '
    networks:
      - core-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=core-network"
      - "traefik.http.routers.vault.rule=Host(`vault.local`)"
      - "traefik.http.routers.vault.entrypoints=websecure"
      - "traefik.http.routers.vault.tls=true"
      - "traefik.http.services.vault.loadbalancer.server.port=8200"
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 >/dev/null 2>&1; code=$$?; [ $$code -eq 0 ] || [ $$code -eq 2 ]"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8100:3000"
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.local}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - core-network
    depends_on:
      loki:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=core-network"
      - "traefik.http.routers.grafana.rule=Host(`grafana.local`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    user: root
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./configs/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/var/loki
    networks:
      - core-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=core-network"
      - "traefik.http.routers.loki.rule=Host(`loki.local`)"
      - "traefik.http.routers.loki.entrypoints=websecure"
      - "traefik.http.routers.loki.tls=true"
      - "traefik.http.services.loki.loadbalancer.server.port=3100"
    healthcheck:
      test: ["CMD", "loki", "-version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    ports:
      - "8101:12345"
    volumes:
      - ./configs/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # logs-file scenario mounts: give alloy read access to file-based log volumes
      - traefik_logs:/var/log/traefik:ro
      - vault_logs:/vault/logs:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    networks:
      - core-network
    depends_on:
      loki:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=core-network"
      - "traefik.http.routers.alloy.rule=Host(`alloy.local`)"
      - "traefik.http.routers.alloy.entrypoints=websecure"
      - "traefik.http.routers.alloy.tls=true"
      - "traefik.http.services.alloy.loadbalancer.server.port=12345"
    healthcheck:
      test: ["CMD", "alloy", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  core-frontend:
    image: ghcr.io/ramachavali/core-frontend:latest
    container_name: core-frontend
    restart: unless-stopped
    ports:
      - "8084:5000"
    depends_on:
      vault:
        condition: service_started
    environment:
      PORTAL_TITLE: ${PORTAL_TITLE:-Core Services Portal}
      VAULT_UI_URL: ${VAULT_UI_URL:-https://vault.local}
      TRAEFIK_UI_URL: ${TRAEFIK_UI_URL:-https://traefik.local}
      GRAFANA_UI_URL: ${GRAFANA_UI_URL:-https://grafana.local}
      ALLOY_UI_URL: ${ALLOY_UI_URL:-https://alloy.local}
      TRAEFIK_API_URL: http://traefik:8080/api
    networks:
      - core-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=core-network"
      - "traefik.http.routers.core-frontend.rule=Host(`core.local`)"
      - "traefik.http.routers.core-frontend.entrypoints=websecure"
      - "traefik.http.routers.core-frontend.tls=true"
      - "traefik.http.services.core-frontend.loadbalancer.server.port=5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:5000/health\")'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  core-network:
    driver: bridge
    name: core-network

volumes:
  auth_postgres_data:
    name: auth_postgres_data
  keycloak_data:
    name: keycloak_data
  traefik_certs:
    name: traefik_certs
  traefik_logs:
    name: traefik_logs
  vault_data:
    name: vault_data
  vault_logs:
    name: vault_logs
  grafana_data:
    name: grafana_data
  loki_data:
    name: loki_data
  redis_data:
    name: redis_data
