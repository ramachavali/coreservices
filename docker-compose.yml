services:
  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "5001:5001"
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - ./configs/registry:/var/lib/registry
    networks:
      - core-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=core-network"
      - "traefik.http.routers.registry.rule=Host(`registry.local`)"
      - "traefik.http.routers.registry.entrypoints=websecure"
      - "traefik.http.routers.registry.tls=false"
      - "traefik.http.routers.registry.service=registry"
      - "traefik.http.services.registry.loadbalancer.server.port=5001"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://0.0.0.0:5001/v2/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080"  # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../ai-stack-homelab/configs/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../ai-stack-homelab/configs/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_certs:/certs
      - traefik_logs:/var/log/traefik
    networks:
      - core-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.local`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  vault:
    image: hashicorp/vault:latest
    container_name: vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    security_opt:
      - no-new-privileges:true
    user: root
    ports:
      - "8083:8200"
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
      - ./configs/vault/config.hcl:/vault/config/config.hcl:ro
    command: >
      sh -ec '
      chown -R vault:vault /vault/data /vault/logs;
      exec su vault -s /bin/sh -c "vault server -config=/vault/config/config.hcl"
      '
    networks:
      - core-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=core-network"
      - "traefik.http.routers.vault.rule=Host(`vault.local`)"
      - "traefik.http.routers.vault.entrypoints=websecure"
      - "traefik.http.routers.vault.tls=true"
      # Optional: router.service auto-resolves for single-service containers
      # - "traefik.http.routers.vault.service=vault"
      - "traefik.http.services.vault.loadbalancer.server.port=8200"
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 >/dev/null 2>&1; code=$$?; [ $$code -eq 0 ] || [ $$code -eq 2 ]"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8100:3000"
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.local}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - core-network
    depends_on:
      loki:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=core-network"
      - "traefik.http.routers.grafana.rule=Host(`grafana.local`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.service=grafana"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    user: root
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./configs/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/var/loki
    networks:
      - core-network
    healthcheck:
      test: ["CMD", "loki", "-version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    ports:
      - "8101:12345"
    volumes:
      - ./configs/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # logs-file scenario mounts: give alloy read access to file-based log volumes
      - traefik_logs:/var/log/traefik:ro
      - vault_logs:/vault/logs:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    networks:
      - core-network
    depends_on:
      loki:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=core-network"
      - "traefik.http.routers.alloy.rule=Host(`alloy.local`)"
      - "traefik.http.routers.alloy.entrypoints=websecure"
      - "traefik.http.routers.alloy.tls=true"
      - "traefik.http.services.alloy.loadbalancer.server.port=12345"
    healthcheck:
      test: ["CMD", "alloy", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  core-frontend:
    image: registry.local/core-frontend:latest
    container_name: core-frontend
    restart: unless-stopped
    ports:
      - "8084:5000"
    depends_on:
      vault:
        condition: service_started
    environment:
      PORTAL_TITLE: ${PORTAL_TITLE:-Core Services Portal}
      VAULT_UI_URL: ${VAULT_UI_URL:-https://vault.local}
      TRAEFIK_UI_URL: ${TRAEFIK_UI_URL:-https://traefik.local}
      GRAFANA_UI_URL: ${GRAFANA_UI_URL:-https://grafana.local}
      ALLOY_UI_URL: ${ALLOY_UI_URL:-https://alloy.local}
      TRAEFIK_API_URL: http://traefik:8080/api
    networks:
      - core-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=core-network"
      - "traefik.http.routers.core-frontend.rule=Host(`core.local`)"
      - "traefik.http.routers.core-frontend.entrypoints=websecure"
      - "traefik.http.routers.core-frontend.tls=true"
      # Optional: router.service auto-resolves for single-service containers
      # - "traefik.http.routers.core-frontend.service=core-frontend"
      - "traefik.http.services.core-frontend.loadbalancer.server.port=5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:5000/health\")'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  core-network:
    driver: bridge
    name: core-network

volumes:
  auth_postgres_data:
    name: auth_postgres_data
  keycloak_data:
    name: keycloak_data
  traefik_certs:
    name: traefik_certs
  traefik_logs:
    name: traefik_logs
  vault_data:
    name: vault_data
  vault_logs:
    name: vault_logs
  grafana_data:
    name: grafana_data
  loki_data:
    name: loki_data
