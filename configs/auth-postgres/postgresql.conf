# PostgreSQL Configuration for Authentication Services
# Hardened security settings for Keycloak and Vault
# Optimized for authentication workloads

#------------------------------------------------------------------------------
# CONNECTION SETTINGS
#------------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100
superuser_reserved_connections = 3

#------------------------------------------------------------------------------
# MEMORY SETTINGS
#------------------------------------------------------------------------------
shared_buffers = 256MB
effective_cache_size = 1GB
maintenance_work_mem = 64MB
work_mem = 4MB

#------------------------------------------------------------------------------
# WRITE AHEAD LOG (WAL)
#------------------------------------------------------------------------------
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
wal_buffers = 16MB
wal_compression = on

#------------------------------------------------------------------------------
# QUERY PLANNING
#------------------------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

#------------------------------------------------------------------------------
# CHECKPOINTS
#------------------------------------------------------------------------------
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

#------------------------------------------------------------------------------
# LOGGING
#------------------------------------------------------------------------------
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_timezone = 'UTC'
log_connections = on
log_disconnections = on
log_duration = off
log_statement = 'none'
log_min_duration_statement = 1000

#------------------------------------------------------------------------------
# SECURITY
#------------------------------------------------------------------------------
ssl = off  # Handled by Traefik reverse proxy
password_encryption = scram-sha-256

#------------------------------------------------------------------------------
# AUTOVACUUM
#------------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min

#------------------------------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
#------------------------------------------------------------------------------
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

#------------------------------------------------------------------------------
# EXTENSIONS
#------------------------------------------------------------------------------
# shared_preload_libraries = ''  # no extensions needed for auth-only workload

#------------------------------------------------------------------------------
# PERFORMANCE TUNING FOR AUTHENTICATION WORKLOADS
#------------------------------------------------------------------------------
# Keycloak performs many small transactions
synchronous_commit = on
commit_delay = 0
commit_siblings = 5

# Optimize for read-heavy workloads (token validation)
effective_cache_size = 1GB
shared_buffers = 256MB

#------------------------------------------------------------------------------
# CONNECTION POOLING OPTIMIZATION
#------------------------------------------------------------------------------
# Keycloak uses connection pooling
max_prepared_transactions = 0
max_locks_per_transaction = 64
max_pred_locks_per_transaction = 64

#------------------------------------------------------------------------------
# STATEMENT TIMEOUT (SECURITY)
#------------------------------------------------------------------------------
# Prevent long-running queries from blocking
statement_timeout = 30000  # 30 seconds
lock_timeout = 10000       # 10 seconds
idle_in_transaction_session_timeout = 60000  # 1 minute

#------------------------------------------------------------------------------
# RESOURCE LIMITS
#------------------------------------------------------------------------------
temp_file_limit = 1GB
