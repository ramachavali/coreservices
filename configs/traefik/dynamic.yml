# Traefik Dynamic Configuration
# Service-specific routing and middleware

# TLS Configuration for self-signed certificates
tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: false

  stores:
    default:
      defaultCertificate:
        certFile: /certs/cert.pem
        keyFile: /certs/key.pem

# Native host processes — file provider since these are not Docker services
http:
  routers:
    ollama:
      rule: "Host(`ollama.local`)"
      entrypoints:
        - websecure
      tls: {}
      service: ollama

    omnivoice:
      rule: "Host(`omnivoice.local`)"
      entrypoints:
        - websecure
      tls: {}
      service: omnivoice

  services:
    ollama:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:11434"

    omnivoice:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8000"

  middlewares:
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        frameDeny: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"
